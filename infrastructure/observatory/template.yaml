AWSTemplateFormatVersion: '2010-09-09'
Description: Privacy-minimized EdwardDClark.com Site Observatory

Parameters:
  LambdaCodeBucket:
    Type: String
  LambdaCodeKey:
    Type: String
  PublicDistributionId:
    Type: String
  HostedZoneId:
    Type: String
  OwnerEmail:
    Type: String
    Default: ed@collectivestateinference.org
  ObservatoryDomainName:
    Type: String
    Default: observatory.edwarddclark.com
  CognitoDomainPrefix:
    Type: String
    Default: edc-site-observatory
  DigestToEmail:
    Type: String
    Default: ed@collectivestateinference.org
  DigestFromEmail:
    Type: String
    Default: notifications@collectivestateinference.org
  ReplyToEmail:
    Type: String
    Default: ed@collectivestateinference.org
  RetentionDays:
    Type: Number
    Default: 30
    MinValue: 7
    MaxValue: 90

Resources:
  SiteEventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: event_date
          AttributeType: S
        - AttributeName: event_id
          AttributeType: S
      KeySchema:
        - AttributeName: event_date
          KeyType: HASH
        - AttributeName: event_id
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      Tags:
        - Key: Application
          Value: EdwardDClark.com Site Observatory
        - Key: DataClassification
          Value: privacy-minimized web telemetry

  ObservatoryUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: edwarddclark-site-observatory
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AutoVerifiedAttributes:
        - email
      MfaConfiguration: 'ON'
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
      UserPoolTags:
        Application: EdwardDClark.com Site Observatory
        DataClassification: private operational analytics

  ObservatoryUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref ObservatoryUserPool

  ObservatoryUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: edwarddclark-site-observatory-web
      UserPoolId: !Ref ObservatoryUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
      CallbackURLs:
        - !Sub https://${ObservatoryDomainName}/
      LogoutURLs:
        - !Sub https://${ObservatoryDomainName}/
      SupportedIdentityProviders:
        - COGNITO
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  ObservatoryOwner:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref ObservatoryUserPool
      Username: !Ref OwnerEmail
      DesiredDeliveryMediums:
        - EMAIL
      ForceAliasCreation: false
      UserAttributes:
        - Name: email
          Value: !Ref OwnerEmail
        - Name: email_verified
          Value: 'true'

  ObservatoryFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SiteObservatoryData
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource: !GetAtt SiteEventsTable.Arn
              - Effect: Allow
                Action:
                  - cloudwatch:GetMetricData
                Resource: '*'
              - Effect: Allow
                Action:
                  - ses:SendEmail
                Resource: '*'

  ObservatoryFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: edwarddclark-site-observatory
      Runtime: python3.13
      Handler: app.handler
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 20
      ReservedConcurrentExecutions: 5
      Role: !GetAtt ObservatoryFunctionRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          TABLE_NAME: !Ref SiteEventsTable
          PUBLIC_DISTRIBUTION_ID: !Ref PublicDistributionId
          ALLOWED_SITE_ORIGIN: https://edwarddclark.com
          ALLOWED_OPS_ORIGIN: !Sub https://${ObservatoryDomainName}
          DIGEST_TO_EMAIL: !Ref DigestToEmail
          DIGEST_FROM_EMAIL: !Ref DigestFromEmail
          REPLY_TO_EMAIL: !Ref ReplyToEmail
          RETENTION_DAYS: !Ref RetentionDays
      Tags:
        - Key: Application
          Value: EdwardDClark.com Site Observatory

  ObservatoryFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DependsOn: ObservatoryFunction
    Properties:
      LogGroupName: !Sub /aws/lambda/${ObservatoryFunction}
      RetentionInDays: 30

  ObservatoryApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: edwarddclark-site-observatory
      ProtocolType: HTTP
      CorsConfiguration:
        AllowHeaders:
          - authorization
          - content-type
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowOrigins:
          - https://edwarddclark.com
          - !Sub https://${ObservatoryDomainName}
        MaxAge: 300

  ObservatoryApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ObservatoryApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ObservatoryFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 20000

  ObservatoryJwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref ObservatoryApi
      AuthorizerType: JWT
      IdentitySource:
        - $request.header.Authorization
      Name: CognitoJwt
      JwtConfiguration:
        Audience:
          - !Ref ObservatoryUserPoolClient
        Issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${ObservatoryUserPool}

  EventRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ObservatoryApi
      RouteKey: POST /event
      AuthorizationType: NONE
      Target: !Sub integrations/${ObservatoryApiIntegration}

  OverviewRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ObservatoryApi
      RouteKey: GET /overview
      AuthorizationType: JWT
      AuthorizerId: !Ref ObservatoryJwtAuthorizer
      Target: !Sub integrations/${ObservatoryApiIntegration}

  ObservatoryApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ObservatoryApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ObservatoryApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ObservatoryFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ObservatoryApi}/*/*

  DailyDigestRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Sends the EdwardDClark.com site activity digest each morning at 13:15 UTC.
      ScheduleExpression: cron(15 13 * * ? *)
      State: ENABLED
      Targets:
        - Arn: !GetAtt ObservatoryFunction.Arn
          Id: SiteObservatoryDigest

  DailyDigestPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ObservatoryFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DailyDigestRule.Arn

  ObservatoryCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref ObservatoryDomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref ObservatoryDomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Application
          Value: EdwardDClark.com Site Observatory

  ObservatorySiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Application
          Value: EdwardDClark.com Site Observatory

  ObservatoryOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: edwarddclark-site-observatory-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ObservatoryCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: edwarddclark-site-observatory-no-cache
        DefaultTTL: 0
        MaxTTL: 0
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  ObservatoryDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
          - !Ref ObservatoryDomainName
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: ObservatorySiteOrigin
            DomainName: !GetAtt ObservatorySiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref ObservatoryOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: ObservatorySiteOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: !Ref ObservatoryCachePolicy
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        ViewerCertificate:
          AcmCertificateArn: !Ref ObservatoryCertificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  ObservatorySiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ObservatorySiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${ObservatorySiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${ObservatoryDistribution}

  ObservatoryDnsA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ObservatoryDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt ObservatoryDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  ObservatoryDnsAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ObservatoryDomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt ObservatoryDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

Outputs:
  ApiEndpoint:
    Value: !GetAtt ObservatoryApi.ApiEndpoint
  EventsTableName:
    Value: !Ref SiteEventsTable
  UserPoolId:
    Value: !Ref ObservatoryUserPool
  UserPoolClientId:
    Value: !Ref ObservatoryUserPoolClient
  CognitoDomain:
    Value: !Sub https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com
  SiteBucketName:
    Value: !Ref ObservatorySiteBucket
  DistributionId:
    Value: !Ref ObservatoryDistribution
  ObservatoryUrl:
    Value: !Sub https://${ObservatoryDomainName}/
  DigestSchedule:
    Value: 13:15 UTC daily
