name: Deploy website

on:
  workflow_dispatch:
    inputs:
      deploy_infrastructure:
        description: Deploy or update CloudFormation before publishing
        required: true
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - website/**
      - .github/workflows/deploy.yml

permissions:
  id-token: write
  contents: read

concurrency:
  group: edwarddclark-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK_NAME: edwarddclark-website
  DOMAIN_NAME: edwarddclark.com
  HOSTED_ZONE_ID: Z0974116K34TIFVG51RG

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        
      - name: Debug OIDC claims
        uses: github/actions-oidc-debugger@main
        with:
          audience: sts.amazonaws.com
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate CloudFormation
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_infrastructure
        run: aws cloudformation validate-template --template-body file://infrastructure/template.yaml

      - name: Deploy infrastructure
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_infrastructure
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file infrastructure/template.yaml \
            --parameter-overrides \
              DomainName="$DOMAIN_NAME" \
              HostedZoneId="$HOSTED_ZONE_ID" \
              GitHubRepository="${{ github.repository }}" \
              GitHubBranch="main" \
            --no-fail-on-empty-changeset

      - name: Confirm stack is available
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].StackStatus" \
            --output text

      - name: Read stack outputs
        id: stack
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='WebsiteBucketName'].OutputValue" \
            --output text)
          DISTRIBUTION=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)
          test -n "$BUCKET" && test "$BUCKET" != "None"
          test -n "$DISTRIBUTION" && test "$DISTRIBUTION" != "None"
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "distribution=$DISTRIBUTION" >> "$GITHUB_OUTPUT"

      - name: Publish website
        run: |
          aws s3 sync website/ "s3://${{ steps.stack.outputs.bucket }}/" \
            --delete \
            --cache-control "public,max-age=300"

          find website -name '*.html' -print0 | while IFS= read -r -d '' file; do
            key="${file#website/}"
            aws s3 cp "$file" "s3://${{ steps.stack.outputs.bucket }}/$key" \
              --cache-control "public,max-age=60,must-revalidate" \
              --content-type "text/html"
          done

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.stack.outputs.distribution }}" \
            --paths "/*"
