name: Deploy website

on:
  workflow_dispatch:
    inputs:
      deploy_infrastructure:
        description: Deploy or update CloudFormation before publishing
        required: true
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - website/**
      - .github/workflows/deploy.yml

concurrency:
  group: edwarddclark-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK_NAME: edwarddclark-website
  DOMAIN_NAME: edwarddclark.com
  HOSTED_ZONE_ID: Z0974116K34TIFVG51RG

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate CloudFormation
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_infrastructure
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation validate-template --template-body file://infrastructure/template.yaml

      - name: Deploy infrastructure
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_infrastructure
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file infrastructure/template.yaml \
            --parameter-overrides \
              DomainName="$DOMAIN_NAME" \
              HostedZoneId="$HOSTED_ZONE_ID" \
              GitHubRepository="${{ github.repository }}" \
              GitHubBranch="main" \
            --no-fail-on-empty-changeset

      - name: Confirm stack is available
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].StackStatus" \
            --output text

      - name: Read stack outputs
        id: stack
        shell: bash
        run: |
          set -euo pipefail
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='WebsiteBucketName'].OutputValue" \
            --output text)
          DISTRIBUTION=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)
          test -n "$BUCKET" && test "$BUCKET" != "None"
          test -n "$DISTRIBUTION" && test "$DISTRIBUTION" != "None"
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "distribution=$DISTRIBUTION" >> "$GITHUB_OUTPUT"

      - name: Publish website
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync website/ "s3://${{ steps.stack.outputs.bucket }}/" \
            --delete \
            --cache-control "public,max-age=300"

          find website -name '*.html' -print0 | while IFS= read -r -d '' file; do
            key="${file#website/}"
            aws s3 cp "$file" "s3://${{ steps.stack.outputs.bucket }}/$key" \
              --cache-control "public,max-age=60,must-revalidate" \
              --content-type "text/html"
          done

          aws s3 cp website/telemetry-config.json \
            "s3://${{ steps.stack.outputs.bucket }}/telemetry-config.json" \
            --cache-control "no-store,max-age=0" \
            --content-type "application/json" \
            --only-show-errors

          for file in website/observatory/config.js website/observatory/app.js; do
            key="${file#website/}"
            aws s3 cp "$file" "s3://${{ steps.stack.outputs.bucket }}/$key" \
              --cache-control "no-store,max-age=0" \
              --content-type "application/javascript" \
              --only-show-errors
          done

      - name: Invalidate CloudFront
        id: invalidate
        shell: bash
        run: |
          set -euo pipefail
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ steps.stack.outputs.distribution }}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          test -n "$INVALIDATION_ID" && test "$INVALIDATION_ID" != "None"
          echo "invalidation_id=$INVALIDATION_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for CloudFront invalidation
        shell: bash
        run: |
          set -euo pipefail
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ steps.stack.outputs.distribution }}" \
            --id "${{ steps.invalidate.outputs.invalidation_id }}"

      - name: Verify production content
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --retry-all-errors \
            "https://${DOMAIN_NAME}/" --output /tmp/index.html
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --retry-all-errors \
            "https://${DOMAIN_NAME}/favicon.svg" --output /tmp/favicon.svg
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --retry-all-errors \
            "https://${DOMAIN_NAME}/favicon-96x96.png" --output /tmp/favicon-96x96.png
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --retry-all-errors \
            "https://${DOMAIN_NAME}/favicon.ico" --output /tmp/favicon.ico
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --retry-all-errors \
            "https://${DOMAIN_NAME}/current-work/" --output /tmp/current-work.html
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --retry-all-errors \
            "https://${DOMAIN_NAME}/current-work/current-work.css" --output /tmp/current-work.css
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --retry-all-errors \
            "https://${DOMAIN_NAME}/assets/treehouse-logo.svg" --output /tmp/treehouse-logo.svg
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --retry-all-errors \
            "https://${DOMAIN_NAME}/outputs/" --output /tmp/outputs.html
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --retry-all-errors \
            "https://${DOMAIN_NAME}/outputs/outputs.css?v=3" --output /tmp/outputs.css
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --retry-all-errors \
            "https://${DOMAIN_NAME}/assets/research-outputs-hero.webp?v=5" --output /tmp/research-outputs-hero.webp
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --retry-all-errors \
            "https://${DOMAIN_NAME}/telemetry-config.json" --output /tmp/telemetry-config.json
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --retry-all-errors \
            "https://${DOMAIN_NAME}/observatory/" --output /tmp/observatory.html
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --retry-all-errors \
            "https://${DOMAIN_NAME}/observatory/config.js" --output /tmp/observatory-config.js
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --retry-all-errors \
            "https://${DOMAIN_NAME}/observatory/app.js" --output /tmp/observatory-app.js

          cmp website/index.html /tmp/index.html
          cmp website/favicon.svg /tmp/favicon.svg
          cmp website/favicon-96x96.png /tmp/favicon-96x96.png
          cmp website/favicon.ico /tmp/favicon.ico
          grep -Fq 'href="/favicon.svg" type="image/svg+xml" sizes="any"' /tmp/index.html
          grep -Fq 'href="/favicon-96x96.png" type="image/png" sizes="96x96"' /tmp/index.html
          grep -Fq 'href="/favicon.ico"' /tmp/index.html

          cmp website/current-work/index.html /tmp/current-work.html
          cmp website/current-work/current-work.css /tmp/current-work.css
          cmp website/assets/treehouse-logo.svg /tmp/treehouse-logo.svg
          grep -Fq "url('/assets/treehouse-logo.svg')" /tmp/current-work.css

          cmp website/outputs/index.html /tmp/outputs.html
          cmp website/outputs/outputs.css /tmp/outputs.css
          cmp website/assets/research-outputs-hero.webp /tmp/research-outputs-hero.webp
          test "$(wc -c < /tmp/research-outputs-hero.webp)" -eq 11198
          grep -Fq 'class="outputs-hero-image"' /tmp/outputs.html
          grep -Fq '/assets/research-outputs-hero.webp?v=5' /tmp/outputs.html

          cmp website/observatory/index.html /tmp/observatory.html
          cmp website/observatory/config.js /tmp/observatory-config.js
          cmp website/observatory/app.js /tmp/observatory-app.js
          grep -Fq "Site Observatory" /tmp/observatory.html
          grep -Fq "/personal-site" /tmp/observatory-app.js

          jq -e '.enabled == true and (.endpoint | startswith("https://"))' \
            /tmp/telemetry-config.json >/dev/null
