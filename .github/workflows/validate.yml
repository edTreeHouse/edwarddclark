name: Validate website

on:
  pull_request:
    branches: [main]
    paths:
      - website/**
      - infrastructure/**
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate repository structure
        shell: bash
        run: |
          set -euo pipefail

          test -s website/index.html
          test -s website/current-work/index.html
          test -s website/current-work/current-work.css
          test -s website/assets/treehouse-logo.svg
          test -s website/attribution.js
          test -s website/telemetry-config.json
          test -s website/observatory/index.html
          test -s website/observatory/styles.css
          test -s website/observatory/app.js
          test -s website/observatory/config.js
          test -s infrastructure/template.yaml

          if find website -type l -print -quit | grep -q .; then
            echo "Symbolic links are not allowed under website/." >&2
            exit 1
          fi

          grep -Fq "url('/assets/treehouse-logo.svg')" website/current-work/current-work.css

          for file in \
            website/index.html \
            website/about/index.html \
            website/research/index.html \
            website/outputs/index.html \
            website/current-work/index.html; do
            grep -Fq '<script src="/attribution.js" defer></script>' "$file" || {
              echo "Attribution script is not loaded by $file" >&2
              exit 1
            }
          done

          grep -Fq "utm_source" website/attribution.js
          grep -Fq "via', 'edwarddclark.com'" website/attribution.js
          grep -Fq "navigator.globalPrivacyControl" website/attribution.js
          grep -Fq "navigator.doNotTrack" website/attribution.js
          grep -Fq "edc-site-session-v1" website/attribution.js
          grep -Fq "page_view" website/attribution.js
          grep -Fq "outbound_click" website/attribution.js
          jq -e '.enabled == true and (.endpoint | startswith("https://"))' website/telemetry-config.json >/dev/null

          grep -Fq 'meta name="robots" content="noindex,nofollow,noarchive"' website/observatory/index.html
          grep -Fq "Site Observatory" website/observatory/index.html
          grep -Fq "/personal-site" website/observatory/app.js
          grep -Fq "code_challenge_method: 'S256'" website/observatory/app.js
          grep -Fq "https://auth.collectivestateinference.org" website/observatory/config.js
          grep -Fq "https://edwarddclark.com/observatory/" website/observatory/config.js

          node --check website/attribution.js
          node --check website/observatory/app.js
          node --check website/observatory/config.js

          while IFS= read -r -d '' file; do
            grep -Fq '</html>' "$file" || {
              echo "Missing closing </html> tag: $file" >&2
              exit 1
            }
          done < <(find website -name '*.html' -print0)

      - name: Validate CloudFormation syntax markers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          template = Path('infrastructure/template.yaml')
          text = template.read_text(encoding='utf-8')
          required = (
              'AWSTemplateFormatVersion:',
              'Resources:',
              'WebsiteBucket:',
              'WebsiteDistribution:',
              'Outputs:',
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'{template} is missing required sections: {missing}')
          PY
