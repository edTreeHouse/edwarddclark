name: Deploy Site Observatory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - website/attribution.js
      - website/telemetry-config.json
      - site-observatory/**
      - functions/site-observatory/**
      - infrastructure/observatory/**
      - .github/workflows/deploy-site-observatory.yml
      - .github/workflows/deploy.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: edwarddclark-site-observatory-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  PUBLIC_STACK_NAME: edwarddclark-website
  OBSERVATORY_STACK_NAME: edwarddclark-site-observatory
  OBSERVATORY_DOMAIN: observatory.edwarddclark.com
  HOSTED_ZONE_ID: Z0974116K34TIFVG51RG

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile functions/site-observatory/app.py
          node --check site-observatory/app.js
          node --check website/attribution.js

          grep -Fq "Global Privacy Control" infrastructure/observatory/README.md
          grep -Fiq "raw IP" infrastructure/observatory/README.md
          grep -Fq 'meta name="robots" content="noindex,nofollow,noarchive"' site-observatory/index.html
          grep -Fq "navigator.globalPrivacyControl" website/attribution.js
          grep -Fq "navigator.doNotTrack" website/attribution.js
          grep -Fq "RETENTION_DAYS" functions/site-observatory/app.py

      - name: Resolve public site resources
        id: public
        shell: bash
        run: |
          set -euo pipefail
          BUCKET="$(aws cloudformation describe-stacks \
            --stack-name "${PUBLIC_STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='WebsiteBucketName'].OutputValue | [0]" \
            --output text)"
          DISTRIBUTION="$(aws cloudformation describe-stacks \
            --stack-name "${PUBLIC_STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue | [0]" \
            --output text)"
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          test -n "${BUCKET}" && test "${BUCKET}" != "None"
          test -n "${DISTRIBUTION}" && test "${DISTRIBUTION}" != "None"
          echo "bucket=${BUCKET}" >> "$GITHUB_OUTPUT"
          echo "distribution=${DISTRIBUTION}" >> "$GITHUB_OUTPUT"
          echo "account_id=${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"

      - name: Package Lambda
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/edc-observatory
          cp functions/site-observatory/app.py /tmp/edc-observatory/app.py
          (cd /tmp/edc-observatory && zip -q /tmp/edc-site-observatory.zip app.py)
          KEY="_deployment-artifacts/site-observatory/${GITHUB_SHA}/api.zip"
          aws s3 cp /tmp/edc-site-observatory.zip \
            "s3://${{ steps.public.outputs.bucket }}/${KEY}" \
            --content-type application/zip --only-show-errors
          echo "key=${KEY}" >> "$GITHUB_OUTPUT"

      - name: Validate CloudFormation
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation validate-template \
            --template-body file://infrastructure/observatory/template.yaml >/dev/null

      - name: Recover failed create stack if necessary
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(aws cloudformation describe-stacks \
            --stack-name "${OBSERVATORY_STACK_NAME}" \
            --query 'Stacks[0].StackStatus' --output text 2>/dev/null || true)"
          if [ "${STATUS}" = "ROLLBACK_COMPLETE" ]; then
            echo "Removing prior ROLLBACK_COMPLETE stack before retry."
            aws cloudformation delete-stack --stack-name "${OBSERVATORY_STACK_NAME}"
            aws cloudformation wait stack-delete-complete --stack-name "${OBSERVATORY_STACK_NAME}"
          fi

      - name: Deploy Observatory infrastructure
        shell: bash
        run: |
          set -euo pipefail
          if ! aws cloudformation deploy \
            --stack-name "${OBSERVATORY_STACK_NAME}" \
            --template-file infrastructure/observatory/template.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              LambdaCodeBucket="${{ steps.public.outputs.bucket }}" \
              LambdaCodeKey="${{ steps.package.outputs.key }}" \
              PublicDistributionId="${{ steps.public.outputs.distribution }}" \
              HostedZoneId="${HOSTED_ZONE_ID}" \
              ObservatoryDomainName="${OBSERVATORY_DOMAIN}" \
              CognitoDomainPrefix="edc-site-observatory-${{ steps.public.outputs.account_id }}" \
              OwnerEmail="ed@collectivestateinference.org" \
              DigestToEmail="ed@collectivestateinference.org" \
              DigestFromEmail="notifications@collectivestateinference.org" \
              ReplyToEmail="ed@collectivestateinference.org" \
              RetentionDays="30" \
            --tags Application="EdwardDClark.com Site Observatory" Environment=Production; then
            echo "::group::Recent CloudFormation failure events"
            aws cloudformation describe-stack-events \
              --stack-name "${OBSERVATORY_STACK_NAME}" \
              --query "StackEvents[?contains(ResourceStatus, 'FAILED') || contains(ResourceStatus, 'ROLLBACK')].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
              --output table || true
            echo "::endgroup::"
            exit 1
          fi

      - name: Generate runtime configuration
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          output() {
            aws cloudformation describe-stacks --stack-name "${OBSERVATORY_STACK_NAME}" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue | [0]" --output text
          }

          API_ENDPOINT="$(output ApiEndpoint)"
          CLIENT_ID="$(output UserPoolClientId)"
          COGNITO_DOMAIN="$(output CognitoDomain)"
          SITE_BUCKET="$(output SiteBucketName)"
          OPS_DISTRIBUTION="$(output DistributionId)"

          cat > site-observatory/config.js <<EOF
          window.EDC_OBSERVATORY_CONFIG = Object.freeze({
            apiBaseUrl: '${API_ENDPOINT}',
            cognitoDomain: '${COGNITO_DOMAIN}',
            clientId: '${CLIENT_ID}',
            redirectUri: 'https://${OBSERVATORY_DOMAIN}/',
            logoutUri: 'https://${OBSERVATORY_DOMAIN}/'
          });
          EOF

          cat > /tmp/telemetry-config.json <<EOF
          {"enabled":true,"endpoint":"${API_ENDPOINT}"}
          EOF

          echo "api_endpoint=${API_ENDPOINT}" >> "$GITHUB_OUTPUT"
          echo "site_bucket=${SITE_BUCKET}" >> "$GITHUB_OUTPUT"
          echo "ops_distribution=${OPS_DISTRIBUTION}" >> "$GITHUB_OUTPUT"

      - name: Publish private Observatory
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync site-observatory/ \
            "s3://${{ steps.runtime.outputs.site_bucket }}/" \
            --delete --cache-control "no-store" --only-show-errors

      - name: Activate public telemetry
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp /tmp/telemetry-config.json \
            "s3://${{ steps.public.outputs.bucket }}/telemetry-config.json" \
            --content-type application/json \
            --cache-control "no-store,max-age=0" \
            --only-show-errors

      - name: Remove deployment artifact
        if: always() && steps.public.outputs.bucket != '' && steps.package.outputs.key != ''
        shell: bash
        run: |
          aws s3 rm \
            "s3://${{ steps.public.outputs.bucket }}/${{ steps.package.outputs.key }}" \
            --only-show-errors || true

      - name: Invalidate CloudFront
        shell: bash
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.runtime.outputs.ops_distribution }}" \
            --paths "/*" >/dev/null
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.public.outputs.distribution }}" \
            --paths "/attribution.js" "/telemetry-config.json" >/dev/null

      - name: Verify security and production wiring
        shell: bash
        run: |
          set -euo pipefail
          API="${{ steps.runtime.outputs.api_endpoint }}"

          STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' "${API}/overview")"
          test "${STATUS}" = "401" || test "${STATUS}" = "403"

          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "https://${OBSERVATORY_DOMAIN}/" | grep -q "Site Observatory"; then
              break
            fi
            test "${attempt}" -lt 18 || exit 1
            sleep 10
          done

          curl --fail --silent --show-error \
            "https://edwarddclark.com/telemetry-config.json" \
            | jq -e '.enabled == true and (.endpoint | startswith("https://"))' >/dev/null

          curl --fail --silent --show-error \
            "https://edwarddclark.com/attribution.js" \
            | grep -q "edc-site-session-v1"

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "## EdwardDClark.com Site Observatory"
            echo
            echo "- Private dashboard: https://${OBSERVATORY_DOMAIN}/"
            echo "- Telemetry API: \`${{ steps.runtime.outputs.api_endpoint }}\`"
            echo "- Public tracking: enabled"
            echo "- Retention: 30 days"
            echo "- Raw IP storage: disabled"
            echo "- Daily digest: 13:15 UTC"
            echo
            echo "The Cognito owner receives an initial temporary-password email on first stack creation."
          } >> "$GITHUB_STEP_SUMMARY"
